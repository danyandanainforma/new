<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Promo Cashback BNI/MEMBER</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <h1>💰 Kalkulator Promo Cashback</h1>
    
    <div class="calculator-container">
        
        <label for="statusPartner">Status Anda:</label>
        <select id="statusPartner">
            <option value="tidak">Bukan Member / Bukan Partner BNI</option>
            <option value="ya">Member / Partner BNI (Dapat Promo)</option>
        </select>
        
        <label for="kategoriProduk">Kategori Produk:</label>
        <select id="kategoriProduk">
            <option value="lain">Lain-lain</option>
            <option value="furniture">Furniture, Home Accs, Lighting & Wearable AS</option>
        </select>

        <label for="hargaAsli">Total Belanja (Rp):</label>
        <input type="number" id="hargaAsli" placeholder="Contoh: 5000000" min="0">
        
        <button onclick="hitungCashback()">Hitung Promo</button>
        
        <hr>
        
        <h2>Hasil Promo</h2>
        <p>Potensi Cashback: <span id="persenCashback">0%</span></p>
        <p>Nilai Cashback: <span id="nilaiCashback">Rp 0</span></p>
        <p>Harga Akhir (setelah dikurangi cashback): <span id="hargaAkhir">Rp 0</span></p>
        
        <div id="infoCicilan">
            <p style="font-style: italic;">* Berlaku cicilan 0% hingga 12 bulan.</p>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
